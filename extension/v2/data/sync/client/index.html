<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg" href="images/favicon.svg">
  <title>Sync :: Libre Email Client</title>
  <link rel="stylesheet" href="/data/client/theme.css">
  <style>
    /* the same base vars the mail client's index.css defines — theme.css
       derives the rest of the palette from them (body[data-theme]) */
    :root {
      --radius: 10px;
      --bg: light-dark(#f5f6f8, #15171a);
      --fg: light-dark(#1b1d21, #e6e8eb);
    }
    html {
      height: 100%;
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg, #f5f6f8);
      color: var(--fg, #1b1d21);
      font: calc(13px * var(--font-scale, 1))/1.5 system-ui, -apple-system,
            "Segoe UI", Roboto, sans-serif;
    }
    #sync {
      flex: 1 1 auto;
      min-height: 0;
    }
  </style>
</head>
<body>
  <sync-view id="sync"></sync-view>
  <prompt-view id="prompt" hidden></prompt-view>
  <script type="module" src="./index.mjs"></script>
</body>
</html>
